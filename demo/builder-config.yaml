# OpenTelemetry Collector Builder (ocb) manifest.
#
# Assembles a custom Collector binary containing our NATS exporter + receiver,
# plus a couple of standard components to feed and observe the pipeline.
#
# Build with:
#   go run go.opentelemetry.io/collector/cmd/builder@v0.133.0 --config builder-config.yaml

dist:
  name: otelcol-natsdemo
  description: Demo Collector with the NATS exporter and receiver
  output_path: ./_build

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.133.0
  - gomod: github.com/synadia-labs/opentelemetry-collector-nats/receiver/natscorereceiver v0.0.0

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.133.0
  - gomod: github.com/synadia-labs/opentelemetry-collector-nats/exporter/natscoreexporter v0.0.0

# Our components are local (unpublished), so point the builder at the working
# copies. natsclient is pulled in transitively and must be replaced too, because
# a required module's own replace directives are ignored by the main (generated)
# module. Paths are relative to the generated go.mod under ./_build.
replaces:
  - github.com/synadia-labs/opentelemetry-collector-nats/exporter/natscoreexporter => ../../exporter/natscoreexporter
  - github.com/synadia-labs/opentelemetry-collector-nats/receiver/natscorereceiver => ../../receiver/natscorereceiver
  - github.com/synadia-labs/opentelemetry-collector-nats/internal/natsclient => ../../internal/natsclient
